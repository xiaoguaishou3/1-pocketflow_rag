[project]
name = "pocketflow-rag"
version = "0.1.0"
description = "RAG demo using PocketFlow framework"
authors = [
    {name = "74775"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pocketflow (>=0.0.3,<0.0.4)",
    "numpy (>=2.5.0,<3.0.0)",
    "faiss-cpu (>=1.14.3,<2.0.0)",
    "openai (>=2.44.0,<3.0.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "coverage (>=7.14.3,<8.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
